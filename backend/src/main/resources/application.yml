server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 24h
      cookie:
        name: material_session
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/material_studio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${MYSQL_USER:material_app}
    password: ${MYSQL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  storage-root: ${STORAGE_ROOT:./storage}
  demo-enabled: ${DEMO_ENABLED:true}
  simulation-enabled: ${SIMULATION_CONTROL_ENABLED:true}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}
  check-delay-ms: ${TASK_DEFAULT_CHECK_DELAY_MS:1000}
  generation-delay-ms: ${TASK_DEFAULT_GENERATION_DELAY_MS:4000}
  assembly-delay-ms: ${TASK_DEFAULT_ASSEMBLY_DELAY_MS:1000}
  worker:
    enabled: ${TASK_WORKER_ENABLED:true}
    interval-ms: ${TASK_DISPATCH_INTERVAL_MS:500}
